# Cursor CLI (cursor-agent). Sourced by the host (bash). Paths are relative to the container HOME.
AGENT_TITLE="Cursor CLI"
AGENT_VERSION_CMD="cursor-agent --version"
AGENT_START="cursor-agent --force --approve-mcps   [--model <model>]   (list models: cursor-agent models)"
AGENT_LOGIN="NO_OPEN_BROWSER=1 cursor-agent login   (open the printed URL on the host), or opt in with --with-credentials (CURSOR_API_KEY)"
AGENT_MCP_LIST="cursor-agent mcp list"
AGENT_TRANSCRIPTS=".cursor/chats .cursor/projects/*/agent-transcripts"
# Cursor transcripts have no token/model data: the usage CSV must be downloaded by hand.
AGENT_NOTE="after the run, download the usage-events CSV from cursor.com/dashboard (Usage, export) and save it as runs/<branch>/transcripts/cursor-usage.csv; insights: eval/insights/insights.sh <branch> --usage-csv runs/<branch>/transcripts/cursor-usage.csv"
AGENT_CREDENTIALS="CURSOR_API_KEY"
# check-mcp: a tiny real agent call that must list the Playwright tools (costs a few tokens).
AGENT_CHECK_CMD='cursor-agent -p --force --approve-mcps --trust --output-format text "$Q" > "$OUT"'
AGENT_CHECK_HINT="cursor-agent mcp list (playwright must be ready); cursor-agent mcp list-tools playwright; logged in (cursor-agent status)?"
