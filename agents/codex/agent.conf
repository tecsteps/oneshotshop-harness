# OpenAI Codex CLI. Sourced by the host (bash). Paths are relative to the container HOME.
AGENT_TITLE="OpenAI Codex CLI"
AGENT_VERSION_CMD="codex --version"
AGENT_START="codex --dangerously-bypass-approvals-and-sandbox   [-m <model>]  [-c model_reasoning_effort=high]"
AGENT_LOGIN="codex login --device-auth   (ChatGPT subscription; open the URL on the host), or opt in with --with-credentials (OPENAI_API_KEY, then: printenv OPENAI_API_KEY | codex login --with-api-key)"
AGENT_MCP_LIST="codex mcp list"
AGENT_TRANSCRIPTS=".codex/sessions .codex/archived_sessions .codex/history.jsonl"   # sessions/ = all rollout-*.jsonl incl. sub-agents
AGENT_CREDENTIALS="OPENAI_API_KEY"
# check-mcp: a tiny real agent call that must list the Playwright tools (costs a few tokens).
AGENT_CHECK_CMD='codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox "$Q" > "$OUT"'
AGENT_CHECK_HINT="codex mcp list (playwright must be enabled); codex mcp get playwright; check [mcp_servers.playwright] in ~/.codex/config.toml; are you logged in (codex login status)?"
