# opencode. Sourced by the host (bash). Paths are relative to the container HOME.
AGENT_TITLE="opencode"
AGENT_VERSION_CMD="opencode --version"
AGENT_START="opencode   [--model <provider/model>]   (list models: opencode models)"
AGENT_LOGIN="opencode auth login   (pick the provider, paste key or follow the URL), or opt in with --with-credentials (one provider key from .env, see AGENT_CREDENTIALS)"
AGENT_MCP_LIST="opencode mcp list"
AGENT_TRANSCRIPTS=".local/share/opencode"   # opencode.db + storage/ (auth.json excluded)
AGENT_CREDENTIALS="OPENROUTER_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY"
# check-mcp: a tiny real agent call that must list the Playwright tools (costs a few tokens).
AGENT_CHECK_CMD='opencode run "$Q" > "$OUT"'
AGENT_CHECK_HINT="opencode mcp list (playwright must be connected); provider logged in (opencode auth list)?"
