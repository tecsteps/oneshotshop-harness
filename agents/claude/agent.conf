# Claude Code. Sourced by the host (bash). Paths are relative to the container HOME.
AGENT_TITLE="Claude Code"
AGENT_VERSION_CMD="claude --version"
AGENT_START="claude --dangerously-skip-permissions   [--model <id>]  [--effort low|medium|high|xhigh|max]"
AGENT_LOGIN="start claude and use /login (subscription: open the printed URL on the host, paste the code back), or opt in with --with-credentials (ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN from .env)"
AGENT_MCP_LIST="claude mcp list"
AGENT_TRANSCRIPTS=".claude/projects .claude/todos .claude/plans"   # projects/ incl. <session>/subagents/
AGENT_CREDENTIALS="CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY"
# check-mcp: a tiny real agent call that must list the Playwright tools (costs a few tokens).
AGENT_CHECK_CMD='claude -p --dangerously-skip-permissions "$Q" > "$OUT"'
AGENT_CHECK_HINT="claude mcp list (playwright must be Connected); are you logged in (run claude, /status)?"
