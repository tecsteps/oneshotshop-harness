# Harness-owned SonarQube analysis settings (passed with -Dproject.settings; the agent's own
# sonar-project.properties is removed from the scan copy and never read).
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=vendor/**,node_modules/**,public/build/**,public/vendor/**,public/hot,storage/**,bootstrap/cache/**,lang/vendor/**,tests/**,**/*.min.js,**/*.min.css,**/*.map,composer.lock,package-lock.json
sonar.test.inclusions=tests/**
sonar.scm.disabled=false
sonar.scm.provider=git
sonar.working.directory=/tmp/scannerwork
